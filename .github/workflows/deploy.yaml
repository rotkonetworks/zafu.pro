name: Deploy zafu.pro

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  CONTAINER_NAME_ZAFU: zafu-pro
  CONTAINER_NAME_ZIGNER: zigner-zafu-pro
  CONTAINER_PORT_ZAFU: 8108
  CONTAINER_PORT_ZIGNER: 8109
  PROJECT_DIR_ZAFU: zafu.pro
  PROJECT_DIR_ZIGNER: zigner.zafu.pro
  NODE_VERSION: "20"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build site
        run: pnpm build

      - name: Verify build
        run: |
          if [ ! -f dist/index.html ]; then
            echo "Build failed: no index.html found"
            exit 1
          fi

      - name: Package for deployment
        run: tar czf site.tar.gz dist/

      - name: Upload site
        uses: appleboy/scp-action@v0.1.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          source: site.tar.gz
          target: /home/${{ secrets.DEPLOY_USER }}/

      # The site is served by the root-owned containers zafu-landing (:8108) and
      # zigner-landing (:8109), which haproxy routes zafu.pro / zigner.zafu.pro to.
      # Both mount /opt/zafu.pro, now owned by the deploy user. So deploying is
      # just replacing files in that directory -- nginx picks them up immediately.
      # Do NOT bind :8108/:8109 here; those belong to the running containers.

      - name: Deploy site
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            bash -euo pipefail <<'REMOTE_EOF'
            cd /home/${{ secrets.DEPLOY_USER }}

            TARGET=/opt/zafu.pro

            # Unpack the build (no globs: an unmatched glob is fatal under zsh)
            rm -rf dist
            tar xzf site.tar.gz
            test -f dist/index.html || { echo "tarball has no dist/index.html"; exit 1; }

            test -w "$TARGET" || { echo "$TARGET not writable by $(whoami)"; exit 1; }

            # Stage in $HOME, not beside $TARGET: /opt is root-owned, so the
            # deploy user can write inside /opt/zafu.pro but cannot create
            # siblings there. Then swap contents in place -- the containers mount
            # $TARGET itself, so the directory must keep its identity (never
            # rm/recreate it, that would break the bind mount).
            STAGE="$PWD/.deploy-stage"
            rm -rf "$STAGE"
            mkdir -p "$STAGE"
            cp -a dist/. "$STAGE/"
            test -f "$STAGE/index.html"

            find "$TARGET" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
            cp -a "$STAGE/." "$TARGET/"
            rm -rf "$STAGE"

            test -f "$TARGET/index.html" || { echo "swap failed"; exit 1; }

            # Verify through the actual containers, exactly as haproxy reaches them
            for check in "8108:/" "8108:/roadmap" "8109:/zigner"; do
              port=${check%%:*}; path=${check#*:}
              code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$port$path")
              echo "$port$path -> $code"
              [ "$code" = "200" ] || { echo "healthcheck failed"; exit 1; }
            done

            rm -f site.tar.gz
            rm -rf dist

            echo "Deployed asset refs:"
            grep -oE 'assets/[A-Za-z0-9_.-]+\.js' "$TARGET/index.html" | sort -u
            echo "Deployment successful"
            REMOTE_EOF
